services:
  redpanda:
    image: redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 10
  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5434:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: jdbc:postgresql://orders-db:5432/orders
      DATABASE_USERNAME: orders
      DATABASE_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8081:8081"
    depends_on:
      orders-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
  inventory-service:
    build: ./inventory-service
    environment:
      DATABASE_URL: jdbc:postgresql://inventory-db:5432/inventory
      DATABASE_USERNAME: inventory
      DATABASE_PASSWORD: inventory
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8082:8082"
    depends_on:
      inventory-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
volumes:
  orders_data:
  inventory_data:
