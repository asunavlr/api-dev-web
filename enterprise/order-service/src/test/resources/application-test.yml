spring:
  datasource:
    url: jdbc:h2:mem:orders-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
outbox:
  poll-interval-ms: 3600000
